# FIX H10 (docker): `version: '3.9'` is deprecated in modern Docker Compose
# (logs a warning). Removed. Also added a `node-server` service so the nginx
# `/api/` proxy target actually exists (previously 502'd on every API call).
# FIX (audit H-4): node-server now uses the dedicated non-root `server` stage
# (previously `target: build`, which contains the full source tree, dev
# toolchain and — before .dockerignore — the local .env with live API keys).
# Restart policies added so containers recover from transient crashes.
services:
  node-server:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      # Set real secrets via .env file or `docker compose` env override.
    env_file:
      - .env

  app:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - node-server
