server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # FIX (audit M-1): no security headers were set anywhere (nginx, Express,
    # index.html). For a finance PWA that caches portfolio data this layered
    # XSS/clickjacking mitigation is essential. CSP allows the origins the app
    # actually talks to (TradingView scanner/chart, CoinDCX/Binance crypto,
    # Google Apps Script sync, Google Fonts).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:;" always;
    # HSTS belongs at the TLS terminator — enable there once HTTPS is active:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Render/Docker health checks must reach the Node service rather than the
    # SPA fallback (which would otherwise return index.html with HTTP 200).
    location = /health {
        proxy_pass http://node-server:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://node-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required by the live EventSource/SSE market feed.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
